<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordly Caption Display</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100vh; background: #000; overflow: hidden; }
  .caption-strip { position: fixed; bottom: 0; left: 0; width: 100%; height: 20%; }
  .caption-strip iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>
<body>
  <div class="caption-strip">
    <iframe src="https://cmgillespie.github.io/Wordly_iframe_landing/?session=DTFO-2103&key=430528&kiosk=1&fgsize=60px&timeout=2" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>
</body>
</html>
